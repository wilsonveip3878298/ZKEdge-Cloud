<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="160" y1="0" x2="160" y2="200"/><line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="480" y1="0" x2="480" y2="200"/><line x1="640" y1="0" x2="640" y2="200"/>
  </g>

  <!-- Logo -->
  <rect x="40" y="50" width="100" height="100" rx="20" fill="url(#accent)"/>
  <text x="90" y="120" font-size="56" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">Z</text>
  
  <!-- Title -->
  <text x="170" y="90" font-size="36" font-weight="bold" fill="white" font-family="sans-serif">ZKEdge-Cloud</text>
  <text x="170" y="120" font-size="16" fill="#a78bfa" font-family="sans-serif">Plataforma Biométrica Enterprise · Cloud + Edge Computing</text>
  
  <!-- Tags -->
  <rect x="170" y="135" width="90" height="22" rx="4" fill="#6366f1" opacity="0.3"/>
  <text x="215" y="150" font-size="10" fill="#a78bfa" text-anchor="middle" font-family="monospace">ZKTeco</text>
  <rect x="270" y="135" width="110" height="22" rx="4" fill="#6366f1" opacity="0.2"/>
  <text x="325" y="150" font-size="10" fill="#818cf8" text-anchor="middle" font-family="monospace">Golang + NestJS</text>
  <rect x="390" y="135" width="90" height="22" rx="4" fill="#6366f1" opacity="0.2"/>
  <text x="435" y="150" font-size="10" fill="#818cf8" text-anchor="middle" font-family="monospace">SaaS Multi-tenant</text>

  <!-- Right side decorative elements -->
  <circle cx="680" cy="60" r="30" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <circle cx="680" cy="60" r="20" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
  <circle cx="680" cy="60" r="10" fill="#6366f1" opacity="0.2"/>
  
  <rect x="630" y="120" width="100" height="4" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="630" y="130" width="70" height="4" rx="2" fill="#818cf8" opacity="0.2"/>
  <rect x="630" y="140" width="85" height="4" rx="2" fill="#6366f1" opacity="0.15"/>
</svg>
